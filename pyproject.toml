[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrack-mcp"
version = "0.7.2"
description = "Read-mostly MCP server for Dependency-Track with version lifecycle, single-call triage, duplicate-filtering ergonomics, strict input validation, broadcast triage, cross-project vulnerability search, and transient-failure retry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arenadata Security" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "dependency-track",
    "sbom",
    "cyclonedx",
    "vex",
    "cve",
    "vulnerability-triage",
    "security",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/drewrukin/dtrack-mcp"
Repository = "https://github.com/drewrukin/dtrack-mcp"
Issues = "https://github.com/drewrukin/dtrack-mcp/issues"
Changelog = "https://github.com/drewrukin/dtrack-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
dtrack-mcp = "dtrack_mcp.server:main"

[tool.setuptools.packages.find]
include = ["dtrack_mcp*"]
exclude = ["tests*"]
