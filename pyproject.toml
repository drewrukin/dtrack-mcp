[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrack-mcp"
version = "0.7.1"
description = "Read-mostly MCP server for Dependency-Track with version lifecycle, single-call triage, duplicate-filtering ergonomics, strict input validation, broadcast triage, cross-project vulnerability search, and transient-failure retry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arenadata Security" }]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
dtrack-mcp = "dtrack_mcp.server:main"

[tool.setuptools.packages.find]
include = ["dtrack_mcp*"]
exclude = ["tests*"]
